name: United Road Studio CI

on:
  push:
    branches: [united-road-studio-v1]
    paths:
      - "studio/**"
      - ".github/workflows/studio-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall studio
      - name: Run core tests
        run: python -m unittest studio.tests.test_core -v
