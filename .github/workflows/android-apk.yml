name: United Road Studio Android APK

on:
  push:
    branches: [united-road-studio-v1]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check standalone mobile JavaScript
        run: node --check android/app/src/main/assets/mobile.js
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: UnitedRoadStudio-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
